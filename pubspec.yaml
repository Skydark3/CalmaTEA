name: tea_app
description: Aplicación móvil para el apoyo de rutinas y actividades cognitivas en personas con TEA.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.13.4 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  percent_indicator: ^4.2.3
  flutter_tts: ^4.1.0
  google_fonts: ^6.2.1
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/audio/
